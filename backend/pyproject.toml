[project]
name = "enterprise-decision-platform-backend"
version = "0.1.0"
description = "FastAPI backend foundation for the Enterprise Decision Platform"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP017", "E501", "UP038"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
